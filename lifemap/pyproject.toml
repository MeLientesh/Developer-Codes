[tool.poetry]
name = "lifemap"
version = "0.1.0"
description = "An interactive Life Map that visualizes knowledge, skills, habits, goals, projects, relationships, achievements, and aspirations."
authors = ["Your Name <youremail@example.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.8"
flask = "^2.0"
networkx = "^2.5"
matplotlib = "^3.4"
pandas = "^1.2"
jupyter = "^1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"